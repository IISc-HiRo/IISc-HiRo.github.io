# -----------------------------------------------------------------------------
# Publications
# -----------------------------------------------------------------------------
# This file drives the Publications page (/publications/). To add a paper, copy
# an entry below and fill it in. Entries are grouped by `year` (newest first),
# then by type (journal, conference, workshop), and newest first within each type.
#
# Fields:
#   id       Unique anchor slug. Lets other pages deep-link to this paper, e.g.
#            /publications/#ovita. Keep it short, lowercase, and stable.
#   title    Paper title (HTML allowed, e.g. <sup>2</sup>)
#   authors  Author list as a single string. Mark equal first authors with *
#            (e.g. "A Author*, B Author*, R Prakash"); the page then adds an
#            "* Equal contribution" note.
#   venue    Full venue name (shown under the authors). Linked via _data/venues.yml
#            by tag; workshops set their own `venue_url` instead.
#   location City, country for conferences and workshops (omit for journals)
#   tag      Short venue badge shown on the thumbnail (e.g. ICRA'26)
#   year     Publication year (controls grouping/sorting)
#   sort_date Hidden chronological key in YYYY-MM-DD format (not displayed)
#   type     conference | journal | workshop  (controls the filter buttons)
#   image    Filename in assets/img/publication_preview/
#   also     Optional. Another venue where the same work appeared (e.g. an earlier
#            workshop version); shown as "Preliminary version appeared at ..." under the venue.
#   pinned   Optional. Set to true to show this paper first within its year.
#   links    List of { label, url }. Omit `url` to show a non-clickable label.
# -----------------------------------------------------------------------------

